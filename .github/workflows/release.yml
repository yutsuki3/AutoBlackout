name: Release

# Push a tag like v1.0.0 to build the .app and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test
        run: swift test
      - name: Build .app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
      - name: Package
        run: |
          cd .build/release
          ditto -c -k --keepParent AutoBlackout.app "AutoBlackout-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "AutoBlackout-${GITHUB_REF_NAME}.zip" > "AutoBlackout-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            .build/release/AutoBlackout-${{ github.ref_name }}.zip
            .build/release/AutoBlackout-${{ github.ref_name }}.zip.sha256
