name: Release

# Push a tag like v1.0.0 to build the .app and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test
        run: swift test
      - name: Build .app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      - name: Notarize
        run: |
          APP_BUNDLE=".build/release/AutoBlackout.app"
          NOTARIZE_SCRIPT=$(mktemp)
          cat > "$NOTARIZE_SCRIPT" <<'EOF'
          #!/bin/bash
          set -euo pipefail

          APP_BUNDLE="$1"
          APPLE_ID="$2"
          APPLE_ID_APP_PASSWORD="$3"

          # Create temporary zip for notarization
          NOTARIZE_ZIP=$(mktemp).zip
          ditto -c -k --keepParent "$APP_BUNDLE" "$NOTARIZE_ZIP"

          echo "==> Submitting to Apple Notary Service..."
          NOTARY_RESPONSE=$(xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_APP_PASSWORD" \
            --team-id "5F398JK79V" \
            --wait 2>&1)

          REQUEST_ID=$(echo "$NOTARY_RESPONSE" | grep -oP 'id: \K[a-f0-9-]+' | head -1)
          if [ -z "$REQUEST_ID" ]; then
            echo "Failed to get request ID from notary response"
            echo "$NOTARY_RESPONSE"
            exit 1
          fi

          echo "Request ID: $REQUEST_ID"

          echo "==> Waiting for notarization to complete..."
          STATUS="In Progress"
          TIMEOUT=600
          ELAPSED=0
          while [ "$STATUS" = "In Progress" ]; do
            if [ $ELAPSED -gt $TIMEOUT ]; then
              echo "Notarization timeout"
              exit 1
            fi
            sleep 10
            ELAPSED=$((ELAPSED + 10))
            STATUS=$(xcrun notarytool info "$REQUEST_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_APP_PASSWORD" \
              --team-id "5F398JK79V" 2>&1 | grep -oP 'status: \K\w+' || echo "Unknown")
          done

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed with status: $STATUS"
            xcrun notarytool log "$REQUEST_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_APP_PASSWORD" \
              --team-id "5F398JK79V"
            exit 1
          fi

          echo "✅ Notarization accepted"
          rm "$NOTARIZE_ZIP"
          EOF

          chmod +x "$NOTARIZE_SCRIPT"
          "$NOTARIZE_SCRIPT" "$APP_BUNDLE" "${{ secrets.APPLE_ID }}" "${{ secrets.APPLE_ID_APP_PASSWORD }}"
          rm "$NOTARIZE_SCRIPT"
      - name: Staple notary ticket
        run: |
          APP_BUNDLE=".build/release/AutoBlackout.app"
          echo "==> Stapling notary ticket..."
          xcrun stapler staple "$APP_BUNDLE"
          echo "✅ Stapled"
      - name: Package
        run: |
          cd .build/release
          ditto -c -k --keepParent AutoBlackout.app "AutoBlackout-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "AutoBlackout-${GITHUB_REF_NAME}.zip" > "AutoBlackout-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            .build/release/AutoBlackout-${{ github.ref_name }}.zip
            .build/release/AutoBlackout-${{ github.ref_name }}.zip.sha256
