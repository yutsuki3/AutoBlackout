name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --strict
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package .app
        run: scripts/build-app.sh
