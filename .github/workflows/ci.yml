name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Swift version
        run: swift --version
      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --strict
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package .app
        run: scripts/build-app.sh
